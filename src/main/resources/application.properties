spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_APP_USER}
spring.datasource.password=${POSTGRES_APP_PASSWORD}

## Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Server Port
server.port=${APP_PORT:8080}

# Logger
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.securitysandbox.api_security_sandbox.logging=DEBUG
logging.level.com.securitysandbox.api_security_sandbox=INFO
